[package]
name = "espm"
version = "0.0.0"
edition = "2021"
authors = ["Augustin Mauroy"]

[dependencies]
clap = { version = "4.4.8", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.0"
reqwest = { version = "0.11", features = ["json"] }
flate2 = "1.0"
tar = "0.4"
anyhow = "1.0"
semver = "1.0"

[dev-dependencies]
tempfile = "3"
